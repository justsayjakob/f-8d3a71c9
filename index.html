<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Für dich ♡</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; background: #000; color: #f7e9ec; }
body { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
canvas { display: block; width: 100%; max-width: 760px; height: 65vh; height: 65svh; min-height: 220px; max-height: 760px; flex-shrink: 0; cursor: pointer; touch-action: manipulation; }
header { width: 100%; text-align: center; padding: clamp(24px, 5svh, 48px) 20px 0; }
main { text-align: center; padding: 0 16px 16px; }
h1 { font: normal clamp(24px, 6vw, 42px)/1.3 Georgia, serif; margin: 0; text-wrap: balance; }
button { background: transparent; border: 0; color: #bca6ae; font: 14px system-ui; min-height: 44px; padding: 12px 16px; margin-top: 4px; cursor: pointer; touch-action: manipulation; }
@media (max-height: 500px) and (orientation: landscape) {
  header { padding-top: 16px; }
  h1 { font-size: 24px; }
  canvas { height: 70svh; min-height: 180px; }
}
button:focus-visible { outline: 1px solid #eda9bc; border-radius: 4px; }
</style>
</head>
<body>
<header><h1>ganz viel Erfolg my love &lt;3 <span style="color: #f39ab2" aria-label="Herz">♥</span></h1></header>
<canvas id="screen" role="img" aria-label="Ein Strauß rosa Lilien öffnet seine Blüten aus kleinen Schriftzeichen."></canvas>
<main>
<button type="button" onclick="document.getElementById('screen').click()">Noch einmal blühen lassen</button>
</main>
<script src="bouquet.js"></script>
</body>
</html>
