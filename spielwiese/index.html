<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Blumen · Spielwiese</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; background: #000; color: #f7e9ec; }
body { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
canvas { display: block; width: 100%; max-width: 760px; height: 65vh; height: 65svh; min-height: 220px; max-height: 760px; flex-shrink: 0; cursor: pointer; touch-action: manipulation; }
header { width: 100%; text-align: center; padding: clamp(24px, 5svh, 48px) 20px 0; }
main { text-align: center; padding: 0 16px 16px; }
h1 { font: normal clamp(24px, 6vw, 42px)/1.3 Georgia, serif; margin: 0; text-wrap: balance; }
button { background: transparent; border: 0; color: #bca6ae; font: 14px system-ui; min-height: 44px; padding: 12px 16px; margin-top: 4px; cursor: pointer; touch-action: manipulation; }
@media (max-height: 500px) and (orientation: landscape) {
  header { padding-top: 16px; }
  h1 { font-size: 24px; }
  canvas { height: 70svh; min-height: 180px; }
}
button span { font-size: 30px; line-height: 1; }
button:focus-visible { outline: 1px solid #eda9bc; border-radius: 4px; }
.controls { width: min(440px, 100%); margin: 12px auto; padding: 20px; border: 1px solid #382c33; border-radius: 16px; text-align: left; font: 14px system-ui; }
.controls label { display: block; margin: 12px 0 6px; color: #cbbac0; }
.controls input, .controls select { width: 100%; min-height: 44px; font: 16px system-ui; color: #f7e9ec; background: #181317; border: 1px solid #55404b; border-radius: 8px; padding: 10px; }
.controls p { color: #bca6ae; line-height: 1.5; }
</style>
</head>
<body>
<header><h1>ganz viel Erfolg my love &lt;3</h1></header>
<canvas id="screen" role="img" aria-label="Ein Strauß bunter Lilien öffnet seine Blüten aus kleinen Schriftzeichen."></canvas>
<main>
<button type="button" aria-label="Noch einmal blühen lassen" title="Noch einmal blühen lassen" onclick="document.getElementById('screen').click()"><span aria-hidden="true">↻</span></button>
<details class="controls" open>
<summary>Spielwiese</summary>
<p>Änderungen gelten nur für diese Vorschau.</p>
<label for="message">Dein Text</label>
<input id="message" value="ganz viel Erfolg my love &lt;3" maxlength="160">
<label for="palette">Blumenfarben</label>
<select id="palette"><option value="2">Bunt</option><option value="0">Rosa</option><option value="1">Weiß</option></select>
<label for="size">Schriftgröße</label>
<input id="size" type="range" min="18" max="48" value="28">
<button id="reset" type="button">Zurücksetzen</button>
</details>
</main>
<script src="bouquet.js"></script>
<script>
const message = document.getElementById('message');
const paletteSelect = document.getElementById('palette');
const size = document.getElementById('size');
message.addEventListener('input', () => { document.querySelector('h1').textContent = message.value; });
size.addEventListener('input', () => { document.querySelector('h1').style.fontSize = size.value + 'px'; });
paletteSelect.addEventListener('change', () => { window.dispatchEvent(new CustomEvent('flower-palette', { detail: Number(paletteSelect.value) })); });
document.getElementById('reset').addEventListener('click', () => { location.href = location.pathname; });
</script>
</body>
</html>
